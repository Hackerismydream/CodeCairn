[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecairn"
version = "0.1.0"
description = "Auditable long-term memory runtime for coding agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin" }]
maintainers = [{ name = "Martin" }]
keywords = [
  "agent-memory",
  "coding-agents",
  "claude-code",
  "codex",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastembed>=0.8,<0.9",
  "filelock>=3.20,<4.0",
  "httpx>=0.28,<1.0",
  "huggingface-hub>=1.24,<2.0",
  "lancedb>=0.34,<0.35",
  "mcp>=1.27,<2",
  "pydantic>=2.9,<3.0",
  "pyarrow>=25,<26",
  "typer>=0.15,<1.0",
]

[project.urls]
Homepage = "https://github.com/Hackerismydream/CodeCairn"
Documentation = "https://github.com/Hackerismydream/CodeCairn/tree/main/docs"
Issues = "https://github.com/Hackerismydream/CodeCairn/issues"
Repository = "https://github.com/Hackerismydream/CodeCairn"

[dependency-groups]
dev = [
  "import-linter>=2.2,<3.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
codecairn = "codecairn.bootstrap:main"
codecairn-mcp = "codecairn.bootstrap:mcp_main"

[project.entry-points."pico.plugins"]
codecairn = "codecairn.integrations.pico"

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "/.codecairn",
  "/.git",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/benchmark_results",
  "/benchmarks",
  "/dist",
  "/evidence",
  "/htmlcov",
  "/tests",
]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/src/codecairn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codecairn"]

[tool.uv.workspace]
members = ["apps/hub-api"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/hub-api/tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["codecairn"]

[tool.ruff]
line-length = 136
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codecairn"]

[tool.importlinter]
root_package = "codecairn"

[[tool.importlinter.contracts]]
name = "Entrypoints depend inward"
type = "layers"
layers = [
  "codecairn.entrypoints",
  "codecairn.service",
  "codecairn.memory",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on entrypoints"
type = "forbidden"
source_modules = ["codecairn.importers", "codecairn.storage"]
forbidden_modules = ["codecairn.entrypoints"]

[[tool.importlinter.contracts]]
name = "Service depends on ports, not adapters"
type = "forbidden"
source_modules = ["codecairn.service"]
forbidden_modules = ["codecairn.importers", "codecairn.storage"]

[[tool.importlinter.contracts]]
name = "Entrypoints depend on contracts, not adapters"
type = "forbidden"
source_modules = ["codecairn.entrypoints"]
forbidden_modules = ["codecairn.importers", "codecairn.storage"]

[[tool.importlinter.contracts]]
name = "Core does not depend on the Pico Integration Module"
type = "forbidden"
source_modules = [
  "codecairn.bootstrap",
  "codecairn.entrypoints",
  "codecairn.importers",
  "codecairn.memory",
  "codecairn.service",
  "codecairn.storage",
]
forbidden_modules = ["codecairn.integrations.pico"]
