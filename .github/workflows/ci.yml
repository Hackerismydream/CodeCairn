name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install Node.js for the Hub
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups
      - name: Install locked Hub dependencies
        run: npm ci
      - name: Enforce the source budget
        run: make source-budget
      - name: Run architecture, type, runtime, and Hub gates
        run: make check
      - name: Check maintained documentation
        run: make docs-check
      - name: Recompute the public evidence bundle
        run: make evidence-verify
      - name: Build source and wheel artifacts
        run: uv build
      - name: Verify curated artifact inventories
        run: make artifact-check
